services:
  - type: web
    name: server-delay-analyzer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    # one worker: scans and their results live in this process's memory
    startCommand: gunicorn app:app --workers 1 --threads 8 --timeout 180 --bind 0.0.0.0:$PORT
    healthCheckPath: /api/health
    envVars:
      - key: SDA_HOSTED
        value: "1"
      - key: PYTHON_VERSION
        value: "3.12.7"
